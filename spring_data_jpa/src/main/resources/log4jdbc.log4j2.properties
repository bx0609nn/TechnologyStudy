# ========== log4jdbc \u914D\u7F6E ==========

# \u6307\u5B9A\u4F7F\u7528SLF4J\u65E5\u5FD7\u4EE3\u7406
# log4jdbc\u901A\u8FC7SLF4J\u5C06\u65E5\u5FD7\u8F93\u51FA\u5230Log4j2
log4jdbc.spylogdelegator.name=net.sf.log4jdbc.log.slf4j.Slf4jSpyLogDelegator

# \u7981\u7528\u81EA\u52A8\u52A0\u8F7D\u9A71\u52A8
# \u8BBE\u7F6E\u4E3Afalse\u53EF\u4EE5\u907F\u514D\u81EA\u52A8\u52A0\u8F7D\u4E0D\u9700\u8981\u7684\u9A71\u52A8
log4jdbc.auto.load.popular.drivers=false

# \u6307\u5B9A\u771F\u5B9E\u7684MySQL JDBC\u9A71\u52A8
# log4jdbc\u4F1A\u4EE3\u7406\u8FD9\u4E2A\u9A71\u52A8\u6765\u8BB0\u5F55SQL
log4jdbc.drivers=com.mysql.cj.jdbc.Driver

# SQL\u6BCF\u884C\u6700\u5927\u5B57\u7B26\u6570\uFF0C\u8D85\u51FA\u81EA\u52A8\u6362\u884C\uFF080\u8868\u793A\u4E0D\u9650\u5236\uFF09
# \u8BBE\u7F6E\u5177\u4F53\u6570\u503C\u53EF\u4EE5\u8BA9SQL\u65E5\u5FD7\u66F4\u6613\u8BFB
log4jdbc.dump.sql.maxlinelength=70

# \u662F\u5426\u8BB0\u5F55\u5404\u7C7BSQL\u8BED\u53E5
log4jdbc.dump.sql.select=true
log4jdbc.dump.sql.insert=true
log4jdbc.dump.sql.update=true
log4jdbc.dump.sql.delete=true

# \u81EA\u52A8\u4FEE\u526ASQL\u4E2D\u7684\u7A7A\u683C
log4jdbc.trim.sql=true
# \u53BB\u9664SQL\u4E2D\u591A\u4F59\u7684\u7A7A\u884C
log4jdbc.trim.sql.extrablanklines=true